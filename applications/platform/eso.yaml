apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.10.*"          # pin a range, don't float on latest
    helm:
      values: |
        serviceAccount:
          name: external-secrets     # must match eso.tf's pod identity association
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { selfHeal: true }     # no prune here - you don't want ESO's CRDs deleted lightly
    syncOptions: [CreateNamespace=true, Replace=true]  # ClusterSecretStore/SecretStore CRDs are ~700KB each - too big for apply's last-applied-config annotation
