apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopstream-shared-config
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }   # after ESO's CRDs (-1), before service pods (1)
spec:
  project: default
  source:
    repoURL: https://github.com/BhushDevOps/shopstream-gitops.git
    targetRevision: master
    path: shared
  destination: { server: https://kubernetes.default.svc, namespace: shopstream }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry:                            # ESO's webhook may not be up yet on a fresh cluster; keep retrying (~30s, 1m, 2m, 4m, 5m...)
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
