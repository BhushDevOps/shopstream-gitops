apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: oci://public.ecr.aws/karpenter/karpenter
    chart: karpenter
    targetRevision: "1.14.1"
    helm:
      values: |
        serviceAccount:
          name: karpenter    # must match karpenter.tf's pod identity association
        settings:
          clusterName: shopstream-dev
          clusterEndpoint: https://5E59387420D7EB9C7589FEF042CECAD3.gr7.us-east-1.eks.amazonaws.com
        replicas: 1
  destination: { server: https://kubernetes.default.svc, namespace: karpenter }
  syncPolicy:
    automated: { selfHeal: true }     # no prune - avoid tearing down the controller (and its CRDs) lightly
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
