# Settings all services share (Day 8 pattern). Previously created by the
# old shopstream-full umbrella chart (install.sh); moved here so it is
# GitOps-managed like everything else since Day 11's app-of-apps cutover.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopstream-config
data:
  DB_HOST: "shopstream-dev.cq3iemwqw6v5.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "shopstream"
  REDIS_HOST: "redis-0.redis"
  CATALOG_URL: "http://catalog-api:8080"
---
# How to reach AWS Secrets Manager. No credentials here:
# the ESO controller's Pod Identity role provides them (eso.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
# Copy the RDS master secret into a K8s Secret named db-creds,
# re-checked every minute. Git/chart holds the ADDRESS, never the value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: db-creds
  dataFrom:
  - extract:
      key: "arn:aws:secretsmanager:us-east-1:708485767572:secret:rds!db-019f9e8d-fbc7-491e-a348-fb962268de61-pZjrvy"
---
# Day 14 Task 6: tells the Prometheus Operator to scrape /metrics on
# catalog-api, storefront, orders-api. "port: http" matches the NAME given
# to the Service port in chart/templates/service.yaml, not the number
# 8080 itself - ServiceMonitor matches Service ports by name.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopstream-services
spec:
  selector:
    matchExpressions:
    - { key: app, operator: In, values: [catalog-api, storefront, orders-api] }
  endpoints:
  - { port: http, path: /metrics, interval: 15s }
