# Day 5's traffic path. Applying the Gateway makes the
# Load Balancer Controller create a real ALB (takes ~2-3 min).
# Moved here from the old shopstream-full chart so it is
# GitOps-managed like everything else since Day 11's app-of-apps cutover.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: alb
spec:
  controllerName: gateway.k8s.aws/alb
---
# Gateway API's replacement for the "scheme: internet-facing" annotation.
# Without this the LBC builds an INTERNAL ALB in the private subnets -
# its DNS resolves to 10.0.x.x addresses a browser can never reach.
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: web
spec:
  scheme: internet-facing   # public ALB, placed in the role/elb tagged subnets
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:          # attach the LBC configuration above to THIS gateway
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: web
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same          # routes may attach only from this namespace
---
# Gateway API has no annotations, so "target-type: ip" (Day 5) moved into
# this LBC-specific object. Without it the LBC defaults to INSTANCE targets,
# which need a NodePort service - and fails on our ClusterIP with:
#   "TargetGroup port is empty ... service must be of type NodePort or LoadBalancer"
# Day 15: one per backend Service, so each gets its own ALB target group. The ALB
# health check defaults to "/", which only storefront serves (catalog-api and
# orders-api would 404 and be marked unhealthy), so point them at /readyz.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: storefront
spec:
  targetReference:
    name: storefront          # the Service this applies to
  defaultConfiguration:
    targetType: ip            # ALB -> pod IPs directly (the EKS-preferred mode)
    healthCheckConfig: { healthCheckPath: /readyz }
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: orders-api
spec:
  targetReference:
    name: orders-api
  defaultConfiguration:
    targetType: ip
    healthCheckConfig: { healthCheckPath: /readyz }
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: catalog-api
spec:
  targetReference:
    name: catalog-api
  defaultConfiguration:
    targetType: ip
    healthCheckConfig: { healthCheckPath: /readyz }
---
# Path-based routing. The ALB picks a target group by URL path; the most specific
# match wins and "/" is the catch-all. The APIs already serve these exact paths
# (orders-api: /orders, catalog-api: /products), so no URL rewrite is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopstream
spec:
  parentRefs:
  - name: web
  rules:
  - matches: [{ path: { type: PathPrefix, value: /orders } }]
    backendRefs: [{ name: orders-api, port: 8080 }]
  - matches: [{ path: { type: PathPrefix, value: /products } }]
    backendRefs: [{ name: catalog-api, port: 8080 }]
  - matches: [{ path: { type: PathPrefix, value: / } }]
    backendRefs: [{ name: storefront, port: 8080 }]
